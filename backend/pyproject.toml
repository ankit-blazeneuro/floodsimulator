[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroguard-ai"
version = "1.0.0"
description = "Automated Real-Time Meteorological Surveillance & Dam Failure Probability Prediction System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "HydroGuard-AI Team"}]

dependencies = [
    "numpy>=1.25.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "fiona>=1.9.0",
    "simplekml>=1.3.6",
]

[project.optional-dependencies]
shap = ["shap>=0.43.0"]
training = ["imbalanced-learn>=0.11.0", "optuna>=3.4.0", "modal>=0.64.0"]
dashboard = ["streamlit>=1.28.0", "streamlit-folium>=0.15.0", "folium>=0.15.0", "plotly>=5.18.0", "matplotlib>=3.8.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["py.typed"]
